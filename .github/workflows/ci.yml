name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generated files are up to date
        run: |
          npm run generate
          git diff --exit-code -- registry.json components/demo-index.tsx || {
            echo "::error::registry.json or components/demo-index.tsx is out of date. Run 'npm run generate' and commit the result."
            exit 1
          }

      - name: Registry validator
        run: npm run registry:validate

      - name: Registry build
        run: npm run registry:build

      - name: Next build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install browser for critical journeys
        run: npx playwright install --with-deps chromium

      - name: Browser journeys
        run: npm run test:e2e
