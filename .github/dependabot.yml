version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Hold TypeScript 7 (Go-native compiler) until Next.js supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      react-next:
        patterns: ["react", "react-dom", "next", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      dev-tooling:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
